[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "launches"
version = "1.0.0"
description = "Multi-agent content generator — LinkedIn, Twitter, and Email in your voice"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
launches = "launches.cli:main"

[tool.setuptools.packages.find]
include = ["launches*"]
